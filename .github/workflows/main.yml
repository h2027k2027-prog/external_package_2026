name: python external library

on:
    push:
        branches:
            - main

jobs:
    run-python-code:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7

            - name: setup python
              uses: actions/setup-python@v7
              with:
                python-version: '3.12'

            - name: install required libraries
              run: python -m pip install -r require.txt 

            - name: run python
              run: python data.py