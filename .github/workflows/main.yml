name: quality gateway implementation
on:
    push:
        branches:
            - main

jobs:
    run-python-code:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7    

            - name: install required packages
              run: pip install -r require.txt

            - name: run test case
              run: pytest --cov=cal --cov-report=term


