name: quality gateway implementation
on:
    push:
        branches:
            - main

jobs:
    run-python-code:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7       
            - name: install dependencies
              run: pip install -r require.txt
            - name: run test case
              run: pytest --cov=calc --cov-report=term


