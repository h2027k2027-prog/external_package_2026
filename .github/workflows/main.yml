name: Quality Gateway Implementation

on:
  push:
    branches:
      - main

jobs:
    build-job:
        runs-on: ubuntu-latest
        steps:
            - name: checkout code
              uses: actions/checkout@v7
            - name: install required packages
              run: pip install -r require.txt
            - name: run test case
              run: pytest --cov=calc --cov-report=term
            - name: print message
              run: echo "Build completed"
    deploy-job:
        needs: build-job
        runs-on: ubuntu-latest
        steps:
            - name: print message
            run: echo "Deployment is successful"